<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Day Blocks</title>
<meta name="theme-color" content="#ECECE7" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ECECE7; overscroll-behavior: none; }
  #root { height: 100%; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error('not found');
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

const WEEKDAY = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const MONTH_NAMES = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const PALETTE = ['#F5A623', '#34D399', '#4E9EFF', '#9B6BFF', '#FF6FA5', '#2DD4C7', '#F5D033', '#8A8A85'];
const RANGE_AFTER = 31;

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function formatKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function parseKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function textColorFor(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0, 2), 16);
  const g = parseInt(c.substring(2, 4), 16);
  const b = parseInt(c.substring(4, 6), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.55 ? '#141414' : '#F5F5F0';
}

function DayBlocks() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayKey = formatKey(today);

  const [entries, setEntries] = useState({});
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [editingKey, setEditingKey] = useState(null);
  const [draftMain, setDraftMain] = useState('');
  const [draftDetail, setDraftDetail] = useState('');
  const [bulletDraft, setBulletDraft] = useState('');
  const [pageIndex, setPageIndex] = useState(0);

  const pagerRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await storage.get('calendar-entries');
        if (!cancelled && res && res.value) setEntries(JSON.parse(res.value));
      } catch (e) {
        // nothing saved yet
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const persist = useCallback(async (next) => {
    setEntries(next);
    try {
      const res = await storage.set('calendar-entries', JSON.stringify(next));
      setSaveError(!res);
    } catch (e) {
      setSaveError(true);
    }
  }, []);

  const getDay = (key) => entries[key] || { main: '', detail: '', color: null, activities: [] };

  const setColor = (key, color) => {
    const day = getDay(key);
    persist({ ...entries, [key]: { ...day, color } });
  };

  const addBullet = (key, text) => {
    const t = text.trim();
    if (!t) return;
    const day = getDay(key);
    persist({ ...entries, [key]: { ...day, activities: [...(day.activities || []), t] } });
  };

  const removeBullet = (key, idx) => {
    const day = getDay(key);
    persist({ ...entries, [key]: { ...day, activities: (day.activities || []).filter((_, i) => i !== idx) } });
  };

  const openModal = (key) => {
    const day = getDay(key);
    setDraftMain(day.main || '');
    setDraftDetail(day.detail || '');
    setBulletDraft('');
    setEditingKey(key);
  };

  const closeModal = () => {
    if (editingKey) {
      const day = getDay(editingKey);
      persist({ ...entries, [editingKey]: { ...day, main: draftMain.trim(), detail: draftDetail.trim() } });
    }
    setEditingKey(null);
  };

  const scrollToToday = () => {
    if (pagerRef.current) pagerRef.current.scrollTo({ left: 0, behavior: 'smooth' });
    setPageIndex(0);
  };

  const handleScroll = (e) => {
    const el = e.currentTarget;
    const idx = Math.round(el.scrollLeft / el.clientWidth);
    setPageIndex(idx);
  };

  const allDates = Array.from({ length: RANGE_AFTER + 1 }, (_, i) => addDays(today, i));
  const pages = [];
  for (let i = 0; i < allDates.length; i += 4) pages.push(allDates.slice(i, i + 4));

  const recentMains = Array.from(new Set(Object.values(entries).map((d) => d.main).filter(Boolean))).slice(0, 8);
  const editingDay = editingKey ? getDay(editingKey) : null;

  return (
    <div className="db-root">
      <style>{`
        html, body { height: 100%; }
        .db-root {
          --bg: #ECECE7;
          --dot: rgba(20,20,20,0.06);
          --block: #141414;
          --block-border: rgba(20,20,20,0.14);
          --accent: #FF2D2D;
          --text: #141414;
          --text-dim: #6E6E68;
          --block-text: #F2F2ED;
          --block-text-dim: #A3A39D;
          height: 100vh;
          height: 100dvh;
          display: flex;
          flex-direction: column;
          background: var(--bg);
          background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
          background-size: 16px 16px;
          color: var(--text);
          font-family: ui-monospace, 'SF Mono', 'Courier New', monospace;
          box-sizing: border-box;
          overflow: hidden;
        }
        .db-root * { box-sizing: border-box; }

        .db-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 14px 0; flex-shrink: 0; }
        .db-title { font-size: 17px; letter-spacing: 1px; font-weight: 700; }
        .db-today-btn {
          background: transparent; border: 1px solid var(--text); color: var(--text);
          font-family: inherit; font-size: 10px; letter-spacing: 1px;
          padding: 7px 10px; cursor: pointer;
        }
        .db-today-btn:active { border-color: var(--accent); color: var(--accent); }
        .db-hint { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; padding: 10px 16px 8px; flex-shrink: 0; }

        .db-pager {
          flex: 1;
          display: flex;
          overflow-x: auto;
          overflow-y: hidden;
          scroll-snap-type: x mandatory;
          -webkit-overflow-scrolling: touch;
          min-height: 0;
        }
        .db-page {
          flex: 0 0 100%;
          min-width: 100%;
          scroll-snap-align: start;
          display: grid;
          grid-template-columns: 1fr 1fr;
          grid-template-rows: 1fr 1fr;
          gap: 10px;
          padding: 4px 14px 10px;
          min-height: 0;
        }

        .db-day {
          min-height: 0;
          background: var(--block);
          border: 1px solid var(--block-border);
          padding: 12px 12px 10px;
          display: flex;
          flex-direction: column;
          cursor: pointer;
          color: var(--block-text);
          position: relative;
          overflow: hidden;
        }
        .db-day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }

        .db-day-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0; }
        .db-day-name { font-size: 10px; letter-spacing: 1.5px; opacity: 0.7; }
        .db-day-num { font-size: 24px; font-weight: 700; }

        .db-main-text { font-size: 17px; font-weight: 700; line-height: 1.25; margin-bottom: 3px; word-break: break-word; }
        .db-detail-text { font-size: 11px; opacity: 0.75; line-height: 1.3; margin-bottom: 8px; }
        .db-empty-hint { font-size: 11px; opacity: 0.45; margin-top: 2px; }

        .db-bullets { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
        .db-bullets li { font-size: 11px; opacity: 0.8; line-height: 1.3; }
        .db-bullets li::before { content: '•  '; }

        .db-dots { display: flex; justify-content: center; gap: 6px; padding: 4px 0 12px; flex-shrink: 0; }
        .db-dot { width: 5px; height: 5px; background: var(--block-border); }
        .db-dot.active { background: var(--accent); }

        .db-backdrop {
          position: fixed; inset: 0; background: rgba(10,10,10,0.55);
          display: flex; align-items: flex-end; justify-content: center; z-index: 50;
        }
        .db-panel {
          width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto;
          background: #0c0c0c; color: var(--block-text);
          border-top: 1px solid rgba(255,255,255,0.1);
          padding: 18px 16px 22px;
        }
        .db-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .db-panel-title { font-size: 18px; font-weight: 700; }
        .db-close { background: none; border: none; color: var(--block-text-dim); font-size: 18px; cursor: pointer; }

        .db-section { margin-bottom: 16px; }
        .db-label { font-size: 9.5px; letter-spacing: 1.5px; color: var(--block-text-dim); margin-bottom: 7px; }
        .db-input {
          width: 100%; background: #161616; border: 1px solid #2A2A2A; color: var(--block-text);
          font-family: inherit; font-size: 13px; padding: 10px 9px; outline: none;
        }
        .db-input::placeholder { color: #5C5C57; }

        .db-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .db-chip-btn {
          background: transparent; border: 1px solid #2A2A2A; color: var(--block-text-dim);
          font-family: inherit; font-size: 10px; padding: 6px 9px; cursor: pointer;
        }
        .db-chip-btn:active { border-color: var(--accent); color: var(--accent); }

        .db-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
        .db-swatch { width: 30px; height: 30px; border: 2px solid transparent; cursor: pointer; padding: 0; }
        .db-swatch.selected { border-color: #fff; }
        .db-swatch-none {
          width: 30px; height: 30px; border: 1px solid #3A3A3A; background: #161616; color: #6E6E68;
          font-size: 13px; cursor: pointer;
        }

        .db-bullet-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid #2A2A2A; padding: 7px 8px; font-size: 12px; margin-bottom: 6px; }
        .db-bullet-row button { background: none; border: none; color: var(--block-text-dim); cursor: pointer; font-size: 13px; }
        .db-bullet-add { display: flex; gap: 6px; margin-top: 4px; }
        .db-bullet-add input { flex: 1; }
        .db-bullet-add button {
          background: transparent; border: 1px solid #2A2A2A; color: var(--block-text);
          font-size: 12px; padding: 0 12px; cursor: pointer;
        }

        .db-done { width: 100%; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: inherit; font-size: 11px; letter-spacing: 1.5px; padding: 12px; cursor: pointer; margin-top: 4px; }

        .db-loading { flex: 1; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; color: var(--text-dim); }
        .db-save-warning { text-align: center; font-size: 10px; color: var(--accent); letter-spacing: 0.5px; padding: 0 0 8px; flex-shrink: 0; }
      `}</style>

      <div className="db-header">
        <div className="db-title">{MONTH_NAMES[today.getMonth()]} {today.getFullYear()}</div>
        <button className="db-today-btn" onClick={scrollToToday}>TODAY</button>
      </div>
      <div className="db-hint">TAP A BLOCK TO SET IT</div>

      {loading ? (
        <div className="db-loading">LOADING…</div>
      ) : (
        <>
          <div className="db-pager" ref={pagerRef} onScroll={handleScroll}>
            {pages.map((pageDates, pIdx) => (
              <div className="db-page" key={pIdx}>
                {pageDates.map((date) => {
                  const key = formatKey(date);
                  const day = getDay(key);
                  const isToday = key === todayKey;
                  const bg = day.color || undefined;
                  const style = bg ? { background: bg, color: textColorFor(bg) } : undefined;
                  const activities = day.activities || [];
                  return (
                    <div
                      key={key}
                      className={`db-day${isToday ? ' is-today' : ''}`}
                      style={style}
                      onClick={() => openModal(key)}
                    >
                      <div className="db-day-top">
                        <span className="db-day-name">{WEEKDAY[date.getDay()]}</span>
                        <span className="db-day-num">{String(date.getDate()).padStart(2, '0')}</span>
                      </div>
                      {day.main ? (
                        <>
                          <div className="db-main-text">{day.main}</div>
                          {day.detail && <div className="db-detail-text">{day.detail}</div>}
                        </>
                      ) : (
                        <div className="db-empty-hint">+ tap to set</div>
                      )}
                      {activities.length > 0 && (
                        <ul className="db-bullets">
                          {activities.map((a, i) => <li key={i}>{a}</li>)}
                        </ul>
                      )}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          <div className="db-dots">
            {pages.map((_, i) => (
              <span key={i} className={`db-dot${i === pageIndex ? ' active' : ''}`} />
            ))}
          </div>
        </>
      )}

      {saveError && <div className="db-save-warning">COULD NOT SAVE — CHANGES MAY NOT PERSIST</div>}

      {editingKey && editingDay && (
        <div className="db-backdrop" onClick={closeModal}>
          <div className="db-panel" onClick={(e) => e.stopPropagation()}>
            <div className="db-panel-head">
              <div className="db-panel-title">
                {WEEKDAY[parseKey(editingKey).getDay()]} {editingKey.slice(8, 10)}
              </div>
              <button className="db-close" onClick={closeModal} aria-label="Close">×</button>
            </div>

            <div className="db-section">
              <div className="db-label">MAIN ACTIVITY</div>
              <input
                className="db-input"
                placeholder="e.g. Sport"
                value={draftMain}
                onChange={(e) => setDraftMain(e.target.value)}
              />
              {recentMains.length > 0 && (
                <div className="db-chips">
                  {recentMains.map((m) => (
                    <button key={m} className="db-chip-btn" onClick={() => setDraftMain(m)}>{m}</button>
                  ))}
                </div>
              )}
            </div>

            <div className="db-section">
              <div className="db-label">DETAIL</div>
              <input
                className="db-input"
                placeholder="e.g. Chest"
                value={draftDetail}
                onChange={(e) => setDraftDetail(e.target.value)}
              />
            </div>

            <div className="db-section">
              <div className="db-label">COLOR</div>
              <div className="db-swatches">
                <button className="db-swatch-none" onClick={() => setColor(editingKey, null)} aria-label="No color">×</button>
                {PALETTE.map((c) => (
                  <button
                    key={c}
                    className={`db-swatch${editingDay.color === c ? ' selected' : ''}`}
                    style={{ background: c }}
                    onClick={() => setColor(editingKey, c)}
                    aria-label={c}
                  />
                ))}
              </div>
            </div>

            <div className="db-section">
              <div className="db-label">EXTRA</div>
              {(editingDay.activities || []).map((a, i) => (
                <div className="db-bullet-row" key={i}>
                  <span>{a}</span>
                  <button onClick={() => removeBullet(editingKey, i)} aria-label="Remove">×</button>
                </div>
              ))}
              <div className="db-bullet-add">
                <input
                  className="db-input"
                  placeholder="+ add extra item"
                  value={bulletDraft}
                  onChange={(e) => setBulletDraft(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') { addBullet(editingKey, bulletDraft); setBulletDraft(''); }
                  }}
                />
                <button onClick={() => { addBullet(editingKey, bulletDraft); setBulletDraft(''); }}>ADD</button>
              </div>
            </div>

            <button className="db-done" onClick={closeModal}>DONE</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DayBlocks />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
